name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxrender-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libglib2.0-dev \
            libwayland-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Restore target cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-target-

      # The agent runtime comes from dspo/manox via git dependencies (public
      # repo — no token needed); revs are pinned by the committed Cargo.lock.
      - name: GPUI track guard
        run: ./script/check-no-zed-git.sh

      # Chrome/chat split invariant: the chat crate never depends on
      # terminals, webviews, or external-agent wiring (PLAN-CHROME-CHAT-SPLIT
      # §1 — the executable definition of the decoupling).
      - name: Chat-crate dependency guard
        run: ./script/check-chat-crate-deps.sh

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Dual-shell ruling (2026-09-22): the chrome-shell feature config is a
      # first-class build — gate it beside the default one.
      - name: Clippy (chrome-shell feature)
        run: cargo clippy -p manox --features chrome-shell --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast

      # agent-ui's test-support suite (interactive-card wire regressions)
      # compiles ONLY under the feature flag, so the workspace run above
      # never sees it — run it explicitly or it rots silently on upstream
      # API changes (it did exactly that after #52).
      - name: Test (agent-ui test-support)
        run: cargo test -p agent-ui --features test-support --no-fail-fast

      - name: Save target cache
        if: github.event_name == 'push' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
