name: bun
description: >-
  Install the pinned bun toolchain (the pi-harness build) and restore its
  package cache. Bun has no distro package on either runner image, so the
  official script is the install; the version is pinned here and nowhere else.

inputs:
  version:
    description: The bun release to install (without the leading `v`).
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    # The install cache is keyed by the lockfile: a dependency bump misses it,
    # a workflow-only change does not.
    - name: Cache the bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.version }}-${{ hashFiles('pi-harness/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ inputs.version }}-

    # `unzip` is what the install script extracts with, and the Fedora
    # container image carries neither it nor a package list that has it.
    - name: Ensure unzip
      shell: bash
      run: |
        set -euo pipefail
        if command -v unzip >/dev/null 2>&1; then
          exit 0
        fi
        if command -v dnf >/dev/null 2>&1; then
          dnf install -y unzip
        elif command -v apt-get >/dev/null 2>&1; then
          sudo apt-get install -y --no-install-recommends unzip
        else
          echo "::error::no package manager to install unzip with"
          exit 1
        fi

    - name: Install bun
      shell: bash
      env:
        BUN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
        echo "${HOME}/.bun/bin" >> "${GITHUB_PATH}"
        "${HOME}/.bun/bin/bun" --version
