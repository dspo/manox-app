name: linux deps
description: >-
  System libraries for a headless build of the app (GTK3/Wayland/WebKit2GTK for
  wry, plus the X libs gpui links against) and `lld`, which the workflow selects
  as the linker.

runs:
  using: composite
  steps:
    # The .debs are the last network dependency in the pipeline, and a single
    # slow mirror has already held one of these jobs for 18 minutes while its
    # sibling installed the same set in 21 seconds. Keep them locally so a warm
    # run never touches the network.
    - name: Prepare the apt archive directory
      shell: bash
      # The cache action extracts as the runner user; apt fills the directory
      # as root, so hand it over before the restore.
      run: |
        sudo mkdir -p /var/cache/apt/archives
        sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        # Bump the version when the package list below changes.
        key: apt-debs-${{ runner.os }}-v2
        restore-keys: apt-debs-${{ runner.os }}-

    - name: Install system dependencies
      shell: bash
      run: |
        pkgs=(
          lld
          pkg-config
          libasound2-dev
          libfontconfig1-dev
          libx11-dev
          libxcb1-dev
          libxrender-dev
          libxrandr-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          libxi-dev
          libxcursor-dev
          libxinerama-dev
          libglib2.0-dev
          libwayland-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
        )

        # Every install keeps the .debs: they are the next run's cache.
        install() {
          sudo apt-get install -y --no-install-recommends \
            -o APT::Keep-Downloaded-Packages=true \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 "$@"
        }

        # 1. Fully offline: every .deb came back with the cache.
        if sudo apt-get install -y --no-install-recommends \
             --no-download "${pkgs[@]}"; then
          echo "system deps installed from cached .debs (no network)"
        elif install "${pkgs[@]}"; then
          # 2. The runner image ships a populated apt index. Use it before
          #    reaching for `apt-get update`: that fetches one index per
          #    configured repo (Ubuntu archives, Microsoft, HashiCorp, …) and a
          #    single slow mirror holds the job.
          :
        else
          # 3. Only refresh the index when the shipped one cannot satisfy us.
          echo "::warning::apt index cannot satisfy us; refreshing"
          sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -y
          install "${pkgs[@]}"
        fi

        # The cache save tars this directory as the runner user, and apt leaves
        # `partial/` root-only (mode 700): a single permission error aborts the
        # whole archive, which is how the first attempt silently saved nothing.
        sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
        echo "archived .debs: $(ls /var/cache/apt/archives/*.deb | wc -l)"
