name: linux deps
description: >-
  System libraries for a headless build of the app (GTK3/Wayland/WebKit2GTK for
  wry, plus the X libs gpui links against) and `lld`, which the workflow selects
  as the linker.

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        pkgs=(
          lld
          pkg-config
          libfontconfig1-dev
          libx11-dev
          libxcb1-dev
          libxrender-dev
          libxrandr-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev
          libxi-dev
          libxcursor-dev
          libxinerama-dev
          libglib2.0-dev
          libwayland-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
        )

        # The runner image ships a populated apt index, so try that first: an
        # unconditional `apt-get update` fetches one index per configured repo
        # (Ubuntu archives, Microsoft, HashiCorp…) and a single slow mirror can
        # hold the job for 10+ minutes — the tail that dominated this repo's
        # slowest CI runs. Only refresh when the shipped index cannot satisfy
        # the request.
        if sudo apt-get install -y --no-install-recommends "${pkgs[@]}"; then
          exit 0
        fi

        echo "::warning::install from the image's apt index failed; refreshing"
        sudo apt-get -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -y
        sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
