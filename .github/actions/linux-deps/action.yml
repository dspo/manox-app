name: linux deps
description: >-
  System libraries for a headless build of the app (GTK3/Wayland/WebKit2GTK for
  wry, plus the X libs gpui links against) and `lld`, which the workflow selects
  as the linker.

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      # Timeouts and retries: a stalled mirror used to turn a 30s step into an
      # 18-minute one, and it is the only step here with an unbounded tail.
      run: |
        sudo apt-get -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -y
        sudo apt-get install -y --no-install-recommends \
          lld \
          pkg-config \
          libfontconfig1-dev \
          libx11-dev \
          libxcb1-dev \
          libxrender-dev \
          libxrandr-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libxi-dev \
          libxcursor-dev \
          libxinerama-dev \
          libglib2.0-dev \
          libwayland-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev
