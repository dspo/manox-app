[package]
name = "agent-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "agent_ui"
path = "src/lib.rs"

# Visual acceptance for the conversation info bubble (harness=false so it
# runs on the main thread; MacPlatform requires it for offscreen rendering).
[[test]]
name = "visual_bubble"
harness = false

[features]
default = []
# Exposes the `Workspace::diagnostic_*` hooks and the full-workspace overlap
# walk test (`tests/workspace_overlap.rs`). The walk additionally requires the
# local session fixture and is a no-op without it. Run locally via:
#   cargo test -p agent-ui --features test-support --test workspace_overlap
test-support = ["manox-agent-chat-ui/test-support"]


[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
toml.workspace = true
uuid.workspace = true

gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
# LineCap::Round for the composer context ring's stroked arcs — the type must
# be the same copy gpui's StrokeOptions re-exports, hence the workspace pin.
lyon.workspace = true
rust-embed.workspace = true

manox-agent.workspace = true
manox-i18n.workspace = true
manox-agent-chat-ui.workspace = true
manox-agent-chrome-ui.workspace = true
manox-terminal.workspace = true
terminal-ui.workspace = true
manox-components.workspace = true
ai-elements.workspace = true
open.workspace = true
manox-webview.workspace = true

# cx library —— `AgentBuilder` / `SessionHandle` to spawn external agent CLIs
# (claude/codex/copilot) and hold the PTY handle for an `ExternalSession`.
manox-ext-agents.workspace = true

# cx provider config schema —— the Settings → Models panel edits
# `cx.providers.config.yaml` through these structs.
manox-providers.workspace = true

# pi harness backend.
manox-harness = { workspace = true }
ahp.workspace = true
ahp-types.workspace = true
manox-ahp.workspace = true
manox-session-core.workspace = true


[dev-dependencies]
manox-agent = { workspace = true, features = ["test-support"] }
manox-terminal = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
image.workspace = true
serde_json.workspace = true
tempfile = "3"

# The offscreen visual harness reads back a Metal texture, so it is
# macOS-only — as is the platform crate it needs.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-macos = { version = "=0.3.6", features = ["test-support"] }

[lints.clippy]
dbg_macro = "deny"
