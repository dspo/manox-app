[package]
name = "cx-cli"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "cx"
path = "src/main.rs"

[dependencies]
cx.workspace = true
manox-agent.workspace = true
manox-ext-agents.workspace = true
manox-providers.workspace = true
manox-session-core.workspace = true
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6.0"
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
ratatui = "0.29"
signal-hook = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal"] }
futures-util = "0.3"
glob = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
url = "2.5"
which = "7.0"
zstd.workspace = true
resvg = { version = "0.47", optional = true }
image = { workspace = true, optional = true }

[features]
image-output = ["dep:resvg", "dep:image"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"image-output\"))"] }

[dev-dependencies]
tempfile = "3"
