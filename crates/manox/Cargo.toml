[package]
name = "manox"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "manox"
path = "src/main.rs"

[features]
default = []

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true

agent-ui.workspace = true
# `chrome-use` links the in-process Chrome engine (rustwright-core) into the
# gpui app only; the napi host binding (crates/manox-napi — dormant since the
# VS Code extension was removed; kept for a future host re-implementation)
# builds the agent without it.
manox-agent = { workspace = true, features = ["chrome-use"] }
manox-ext-agents.workspace = true
manox-terminal.workspace = true
terminal-ui.workspace = true
supervisor.workspace = true

anyhow.workspace = true
manox-i18n.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

# image —— resize the embedded app icon down to tray-icon size at startup.
image.workspace = true

# System tray backends. macOS/Windows use tray-icon (status item + native menu,
# events drained on the gpui main loop); Linux uses ksni (StatusNotifierItem over
# D-Bus, no GTK main-loop requirement so it coexists with gpui's event loop).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ksni.workspace = true

[dev-dependencies]
# gpui test-support — the headless layout check in src/about.rs measures the
# About dialog's rendered bounds, matching what the other UI crates do.
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
# Cargo.lock 是本次构建所 pin 依赖的唯一事实来源（GPUI 栈版本、dspo/manox rev）；
# About 窗口直接报告它，而不是手工维护的常量表。
toml.workspace = true

[package.metadata.bundle]
identifier = "dev.dspo.manox"
name = "Manox"
icon = ["resources/app-icon.icns", "resources/app-icon@2x.png", "resources/app-icon.png"]
osx_minimum_system_version = "10.15.7"

# Bundle identity for the pi harness build
# can coexist in /Applications. script/bundle-mac reads the matching table.
[package.metadata.bundle.harness.pi]
name = "Manox Pi"
identifier = "dev.dspo.manox.pi"

[lints.clippy]
dbg_macro = "deny"
