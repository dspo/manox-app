[package]
name = "ai-elements"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ai_elements"
path = "src/lib.rs"

# Visual acceptance (harness=false so it runs on the main thread; MacPlatform
# requires it for offscreen rendering).
[[test]]
name = "visual"
harness = false

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
# The rich-text core gpui-component builds on: tool bodies render through the
# same TextView machinery the transcript's markdown uses, so drag-select and
# copy come from the window-level selection instead of per-mock rewrites.
gpui-base.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
gpui-kit-assets.workspace = true
# The gallery renders reasoning bodies through the real markdown component, so
# the demonstrated content is what the app shows rather than a stand-in.
steer-components.workspace = true

# The offscreen visual harness (tests/visual.rs) reads back a Metal texture,
# so it is macOS-only — as is the platform crate it needs.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-macos = { version = "=0.3.10", features = ["test-support"] }
