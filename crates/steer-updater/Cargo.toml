[package]
name = "steer-updater"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
steer-i18n.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
semver = "1"
# The update cache lives next to the OS's own per-user cache
# (`~/Library/Caches/Steer/updates` on macOS).
dirs = "6"
sha2 = "0.11"
# reqwest never enters [workspace.dependencies] — each crate declares its own
# shape. `blocking` rides a `cx.background_spawn` (GPUI is not a tokio runtime;
# the blocking client brings its own).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[dev-dependencies]
serde_json = "1"
# The state-machine tests run against a real gpui app context.
gpui = { workspace = true, features = ["test-support"] }
