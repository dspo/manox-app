[package]
name = "steer-components"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
# The markdown stack drives the gpui-base TextView directly (same crates.io
# train as gpui-component, exact-pinned): the component wrapper exposes neither
# the per-instance code-block highlighter nor heading weights.
gpui-base.workspace = true
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
# The full Lucide catalog the toggle's face icons come from — the component's
# own `IconName` is a subset without `Code`/`Image`.
gpui-kit-assets.workspace = true
log.workspace = true
# The `$$…$$` math block's typesetter — see the workspace comment on this crate.
mathra.workspace = true
# The ```mermaid fence's renderer — see the workspace comment on this crate.
mermaid-rs-renderer.workspace = true
# ropey::Rope is what SyntaxHighlighter::update consumes for syntax highlighting.
ropey.workspace = true
# vte::ansi::Processor + Handler — parse SGR/color escapes in tool output for the TerminalPanel.
vte.workspace = true
hyperlinks.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# The same mdast parser gpui-base drives, so tests can pin the fenced-block
# extraction contract (the panel's byte ranges ride on it) without a window.
markdown = "1.0.0"
