[package]
name = "steer-webview"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "steer_webview"
path = "src/lib.rs"

# The crate body is compiled out on Linux/FreeBSD (see src/lib.rs), so every
# dependency rides the matching target gate — wry/WebKitGTK/GTK never enter a
# Linux build.
[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
anyhow.workspace = true
gpui.workspace = true
steer-webview-macros.workspace = true
wry.workspace = true
raw-window-handle.workspace = true
http.workspace = true
serialize-to-javascript.workspace = true
serde.workspace = true
serde_json.workspace = true
mime_guess.workspace = true
pollster.workspace = true
async-task.workspace = true
rfd.workspace = true
arboard.workspace = true
open.workspace = true

[lints.clippy]
dbg_macro = "deny"
