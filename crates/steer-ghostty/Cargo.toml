[package]
name = "steer-ghostty"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Ghostty-backed terminal surface: libghostty-vt emulation core behind a GPUI element"
links = "ghostty-vt"
build = "build.rs"

[lib]
name = "steer_ghostty"
path = "src/lib.rs"

[features]
# The deterministic TestProcess/TestProbe pair for hosts' own tests.
test-support = []

[dependencies]
gpui.workspace = true
libc = "0.2"
serde.workspace = true
toml.workspace = true
steer-term-process.workspace = true
sysinfo.workspace = true
portable-pty.workspace = true
anyhow.workspace = true
async-channel.workspace = true
unicode-width.workspace = true
