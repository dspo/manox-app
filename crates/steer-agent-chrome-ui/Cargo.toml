[package]
name = "steer-agent-chrome-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "steer_agent_chrome_ui"
path = "src/lib.rs"

# Visual acceptance (harness=false so it runs on the main thread; MacPlatform
# requires it for offscreen rendering).
[[test]]
name = "visual"
harness = false

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
# Chrome icons live as paths into this bundle's full Lucide catalog: the lib
# implements `IconNamed for theme::IconAsset` so the constants feed
# gpui-component icon slots directly, and the guard test pins every path to
# the embedded bytes.
gpui-kit-assets.workspace = true
# Chrome text is app chrome by definition, so the crate resolves its own
# labels through the shared bundles (zh-CN primary, en fallback).
steer-i18n.workspace = true
# The info line's absolute branch (72h+ → local MM-DD HH:MM stamp).
chrono.workspace = true

[dev-dependencies]
# Example + visual harness wire real content: the manox thread store for the
# sidebar, a PTY terminal and a native webview as tool tabs. None of these
# leak into the library's dependency surface — the lib stays data-free.
manox-agent.workspace = true
steer-agent-chat-ui.workspace = true
manox-terminal.workspace = true
terminal-ui.workspace = true
steer-webview.workspace = true
rust-embed.workspace = true
anyhow.workspace = true
serde_json.workspace = true
image.workspace = true
gpui_platform.workspace = true
gpui = { workspace = true, features = ["test-support"] }

# The offscreen visual harness (tests/visual.rs) reads back a Metal texture,
# so it is macOS-only — as is the platform crate it needs.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-macos = { version = "=0.3.7", features = ["test-support"] }

[lints.clippy]
dbg_macro = "deny"
