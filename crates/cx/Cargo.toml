[package]
name = "cx"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "cx"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
steer-ext-agents.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
manox-providers.workspace = true
dirs = "6.0"
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "signal"] }
futures-util = "0.3"
glob = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
