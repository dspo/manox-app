[package]
name = "manox-agent-chat-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "manox_agent_chat_ui"
path = "src/lib.rs"

# The chat crate is conversation-state only: no terminals, no webviews, no
# external-agent wiring (PLAN-CHROME-CHAT-SPLIT §1 — the dependency invariant
# is the executable definition of the chrome/chat decoupling; enforced by
# script/check-chat-crate-deps.sh in CI).
[dependencies]
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

gpui.workspace = true

manox-agent.workspace = true
manox-harness.workspace = true
manox-protocol.workspace = true
manox-session-core.workspace = true

[lints.clippy]
dbg_macro = "deny"
