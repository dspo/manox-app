# manox-app (product name: Steer) — GPUI desktop app + the standalone cx CLI.
# App-side crates are flat in crates/; the agent runtime (manox-*) comes from
# dspo/manox via git tags, with local joint development overridden by
# .cargo/config.toml [patch] (script/local-manox.sh). The GPUI stack is the
# longbridge/gpui-kit line (gpui-pre snapshots + gpui-component); this repo
# never depends on zed-industries/zed directly (script/check-no-zed-git.sh).
[workspace]
members = [
	"crates/cx",
	"crates/cx-cli",
	"crates/steer-ext-agents",
	"crates/agent-ui",
	"crates/ai-elements",
	"crates/steer-app",
	"crates/terminal-ui",
	"crates/steer-components",
	"crates/steer-webview",
	"crates/steer-webview-macros",
	"crates/steer-i18n",
	"crates/steer-agent-chat-ui",
	"crates/steer-agent-chrome-ui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Agent runtime from dspo/manox, consumed via git tags; the CxSessionSource
# bridge (SessionHandle → PtySource) stays in this repo's steer-ext-agents.
manox-agent = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
manox-harness = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
manox-session-core = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
manox-providers = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
supervisor = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
manox-terminal = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
hyperlinks = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }

# AHP is the v3 interaction protocol; the app is a pure AHP client (official
# SDK + the manox extension-channel and in-proc runtime crates). Exact-pinned
# to match the upstream workspace.
ahp = "=1.0.0"
ahp-types = "=1.0.0"
manox-ahp = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }
manox-ahp-runtime = { git = "https://github.com/dspo/manox.git", tag = "v0.6.8" }

agent-ui = { path = "crates/agent-ui" }
steer-app = { path = "crates/steer-app" }
ai-elements = { path = "crates/ai-elements" }
terminal-ui = { path = "crates/terminal-ui" }
steer-components = { path = "crates/steer-components" }
steer-webview = { path = "crates/steer-webview" }
steer-webview-macros = { path = "crates/steer-webview-macros" }
steer-ext-agents = { path = "crates/steer-ext-agents" }
cx = { path = "crates/cx" }
cx-cli = { path = "crates/cx-cli" }
steer-i18n = { path = "crates/steer-i18n" }
steer-agent-chat-ui = { path = "crates/steer-agent-chat-ui" }
steer-agent-chrome-ui = { path = "crates/steer-agent-chrome-ui" }

anyhow = "1"
# The pure-Rust LaTeX math typesetter behind `$$…$$` blocks: a formula becomes
# a standalone SVG (STIX Two Math glyph outlines, MATH-table layout) at
# markdown-parse time and rides the svg fence's raster path.
mathra = "=1.1.1"
# The pure-Rust Mermaid renderer behind the ```mermaid fence: mermaid source
# becomes an SVG document at markdown-parse time and rides the same usvg
# raster path the svg fence paints. SVG output only — gpui rasterizes.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
async-channel = "2"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "net"] }
# tokio-util — CancellationToken, the abort signal type in the AgentTool
# trait the app-side Preview tool implements (same copy the manox runtime
# already locks).
tokio-util = "0.7"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
http = "1"
# fluent + BCP47 — localization stack for the app chrome only (steer-i18n);
# values coming from the manox runtime never pass through it.
fluent = "0.17"
unic-langid = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
zstd = "0.13"
# image — clipboard image resize + PNG re-encode before provider upload
# (Anthropic caps: 1568px long edge / 5MB).
image = "0.25"

# tray-icon — macOS/Windows system tray; menu events are drained by a
# foreground polling task since gpui exposes no cross-thread wake primitive.
tray-icon = "0.24"
# ksni — Linux tray via the StatusNotifierItem D-Bus spec; no GTK main loop,
# coexists with gpui's event loop. default-features = false + async-io: the
# default `tokio` feature makes zbus call tokio::runtime::Handle::current(),
# which panics on gpui's event-loop threads (outside our runtime, e.g. file
# dialogs); `blocking` gives the sync spawn/update API used from the main
# thread.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Exact-pinned to the copies the gpui stack already locks (macOS dock badge),
# so no duplicate objc2 versions enter the tree.
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
# rust-embed — embed SVG icons into the binary so manox stays single-binary.
rust-embed = "8"

# wry — native webview parented to a gpui window; raw-window-handle pinned to
# the major gpui itself uses so the webview resolves the same generation.
wry = "0.53"
raw-window-handle = { version = "0.6", features = ["std"] }

# Tauri-style IPC layer + plugin backends (clipboard/dialog/opener) for the
# Trusted-mode webview in steer-webview.
serialize-to-javascript = "0.1.2"
mime_guess = "2.0"
pollster = "0.4"
async-task = "4.7.1"
rfd = "0.15"
arboard = "3"
open = "5"

# ropey / vte — the same versions gpui-component already locks (Rope input
# to SyntaxHighlighter, ANSI escape parsing for the TerminalPanel).
ropey = "2.0.0-beta.1"
vte = { version = "0.13", default-features = false, features = ["ansi"] }
log = "0.4"

# alacritty_terminal — Term/Grid/Selection data structures only; its own
# EventLoop/PTY layer is unused (manox drives portable-pty and feeds bytes
# to Processor::advance). vte is re-exported by it, keeping one version.
alacritty_terminal = "0.24"
portable-pty = "0.9"

# sysinfo — descendant kill on terminal teardown + foreground-process indicator.
sysinfo = "0.39"

# GPUI stack: gpui-pre is Longbridge's weekly repackaged snapshot of zed's
# gpui, exact-pinned against weekly drift; gpui-component is co-released
# against it (0.8.0 ↔ gpui-pre 0.3.9). Upgrades go through
# `cargo update -p gpui-pre --precise <ver>`.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

gpui-component = { version = "=0.8.0", features = ["tree-sitter-languages", "speech"] }
gpui-kit-assets = { version = "=0.8.0" }
# gpui-base — the same rich-text core gpui-component 0.8.0 builds on (same
# release train). The markdown stack drives the base-layer TextView directly:
# the component wrapper exposes neither the per-instance code-block
# highlighter nor heading weights, and both are hard requirements here.
gpui-base = "=0.8.0"

# lyon — pinned to the version already locked so the composer context ring's
# LineCap::Round is the same copy gpui's StrokeOptions re-exports.
lyon = "=1.0.19"

# Full DWARF grows the largest test targets (cx integration, cx-cli bin tests)
# past ld.lld's limits on GitHub-hosted Linux runners; keep file/line only.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# gpui needs opt-level 3 even in debug, or rendering crawls. Profile keys use
# the real package names (gpui-pre*), not the workspace alias.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
# Mermaid's parser/layout runs during markdown conversion (including every
# streamed append), so unoptimized code shows up as a slow diagram.
mermaid-rs-renderer = { opt-level = 3 }
